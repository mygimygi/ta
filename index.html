question:`황(S) 함유 연료 연소로 배출된 아황산가스(SO₂)가 대기 중에서 유발하는 대표적 환경 피해는?`,options:[`대기 중 수분과 반응해 황산(H₂SO₄)이 되어 산성비를 유발하고 산림과 토양을 황폐화한다.`,`바닷물을 단물(담수)로 바꾸어 해양 생태계를 교란한다.`,`온실효과를 완벽히 막아 지구를 급격한 빙하기로 전환시킨다.`,`식물의 엽록소 생산을 촉진하여 산소 농도를 폭증시킨다.`],correctIndex:0,explanation:`화석연료 속 불순물 황이 연소하여 나온 SO₂는 대기 중 수증기 및 산화제와 결합해 강산인 황산이 되며, 산성비를 형성하여 숲과 건축물을 부식시키고 호흡기 점막을 손상합니다.`},{stageNumber:7,substanceName:`블랙카본`,chemicalFormula:`C (Soot)`,question:`디젤 엔진이나 석탄 난방의 불완전 연소 부산물인 "블랙카본(그을음)"의 온난화 특성은?`,options:[`햇빛을 100% 우주로 반사하여 지구를 냉각시킨다.`,`가시광선을 강하게 흡수해 주변 공기를 데우고, 극지방 눈·빙하 위에 침적되어 얼음의 융해를 가속한다.`,`구름 수분을 완전히 말려 비가 영구히 내리지 않게 한다.`,`자성을 띠어 나침반의 방향을 교란한다.`],correctIndex:1,explanation:`블랙카본은 검은색 탄소 미립자로 태양빛을 직접 흡수하여 강력한 단기 온난화를 일으키며, 북극과 빙하 표면에 쌓여 지표 반사율(알베도)을 낮춤으로써 빙하를 빠르게 녹입니다.`},{stageNumber:8,substanceName:`다이옥신`,chemicalFormula:`PCDD / PCDF`,question:`청산가리보다 수천 배 독성이 강한 1급 발암물질 다이옥신이 주로 발생하는 연소 환경은?`,options:[`순수 수소를 2,000℃ 이상에서 완전 연소시킬 때`,`염소(Cl)가 함유된 폐플라스틱(PVC 등)을 300~500℃의 불완전한 저온에서 소각할 때`,`풍력 발전기가 바람에 의해 회전할 때`,`순수한 물을 가열하여 수증기를 만들 때`],correctIndex:1,explanation:`다이옥신은 염소 성분을 함유한 플라스틱이나 유기 폐기물이 300~500℃의 저온 불완전 소각 과정에서 탈 때 합성되는 잔류성 유기오염물질(POPs)로 극소량으로도 면역 파괴와 암을 일으킵니다.`},{stageNumber:9,substanceName:`벤젠`,chemicalFormula:`C₆H₆`,question:`휘발유 연소 배기가스 및 유기 증기 속 방향족 탄화수소인 벤젠(C₆H₆)의 대표적 인체 위해성은?`,options:[`골격을 강화하여 뼈를 단단하게 만든다.`,`조혈 기관인 골수 기능을 파괴하여 백혈병과 빈혈을 유발하는 1급 인체 발암물질이다.`,`체온을 급격히 떨어뜨려 저체온증을 유발한다.`,`소화 효소를 과다 분비시켜 소화력을 촉진한다.`],correctIndex:1,explanation:`벤젠은 달콤한 냄새가 나는 무색의 방향족 탄화수소로, 체내에 흡수되면 골수 세포에 치명적인 독성을 미쳐 백혈구와 적혈구 생성을 억제하고 백혈병을 유발하는 1급 발암물질입니다.`},{stageNumber:10,substanceName:`포름알데히드`,chemicalFormula:`HCHO`,question:`탄화수소 불완전 연소 중간 생성물이자 새집증후군 원인 물질인 포름알데히드(HCHO)의 특성은?`,options:[`자극성이 매우 강한 기체로 눈 통증, 호흡기 점막 손상 및 비인두암 위험을 높인다.`,`단맛이 나는 무해한 영양 공급 가스이다.`,`흙에 닿으면 즉시 암석으로 굳어져 공기 중으로 전혀 확산되지 않는다.`,`상온에서 얼어붙는 고체 금속이다.`],correctIndex:0,explanation:`포름알데히드는 탄화수소의 불완전 산화 중간 단계에서 생기는 자극성 유독 가스로, 눈과 호흡기 점막에 강한 통증을 유발하며 비인두암 및 백혈병 위험을 높이는 발암 물질입니다.`},{stageNumber:11,substanceName:`톨루엔 & 자일렌`,chemicalFormula:`C₇H₈ / C₈H₁₀`,question:`도료, 시너 등 유기용제 연소 및 휘발로 배출되는 톨루엔·자일렌 증기가 미치는 주요 악영향은?`,options:[`중추신경계를 억제·마비시켜 두통, 어지럼증, 환각을 일으키고 간과 신장을 손상시킨다.`,`호흡기에서 산소 분비량을 2배로 증가시킨다.`,`시력을 3.0 이상으로 일시 개선한다.`,`신체의 모든 피로 물질을 즉시 분해한다.`],correctIndex:0,explanation:`톨루엔과 자일렌은 지용성 방향족 화합물로 뇌와 중추신경계 지질층에 빠르게 침투하여 마취 작용과 신경 손상을 일으키고, 장기 노출 시 간과 신장 기능을 파괴합니다.`},{stageNumber:12,substanceName:`다환방향족탄화수소`,chemicalFormula:`PAHs`,question:`유기물 불완전 연소 시 생성되는 PAHs(벤조피렌 등)의 가장 치명적인 유전적 독성은?`,options:[`피부에 일시적인 윤기만을 부여한다.`,`체내 세포의 DNA와 직접 결합하여 유전자 돌연변이를 일으키고 폐암 등을 유발한다.`,`혈액 순환 속도를 정상 범위로 안정화한다.`,`치아 표면을 코팅해 충치를 방지한다.`],correctIndex:1,explanation:`다환방향족탄화수소(PAHs)는 여러 개의 벤젠고리가 융합된 화합물로, 체내 대사 과정에서 활성화되어 DNA 염기쌍 사이에 끼어들어 유전자 변이와 암(폐암, 피부암)을 유발합니다.`},{stageNumber:13,substanceName:`산성 안개 스모그`,chemicalFormula:`Acid Smog`,question:`1952년 런던 스모그처럼 SO₂와 NO₂가 대기 중 안개 물방울에 용해되어 생기는 산성 안개의 위험성은?`,options:[`pH 2 이하의 강산성 농축 액적으로 폐포를 급성 부식시켜 호흡 곤란을 일으킨다.`,`피부에 닿으면 주름을 개선하는 보습 효과를 제공한다.`,`대기 중 온도를 영상 25℃로 쾌적하게 유지한다.`,`공기 중 산소 농도를 70%까지 끌어올린다.`],correctIndex:0,explanation:`산성 안개는 오염물질이 작은 안개 방울 속에 고농도로 농축되어 pH 1.5~2 수준의 강산을 형성하므로, 흡입 시 기관지와 폐포를 직접 부식시켜 대량의 사망자를 발생시킨 역사적 재앙입니다.`},{stageNumber:14,substanceName:`휘발성유기화합물`,chemicalFormula:`VOCs`,question:`연소 배기가스 속 VOCs가 여름철 강한 자외선과 질소산화물을 만났을 때 촉발하는 현상은?`,options:[`광화학 반응을 통해 지표면에 해로운 오존(O₃)과 광화학 스모그를 대량 생성한다.`,`겨울철 폭설을 내리게 하는 순수 인공 구름 씨앗이 된다.`,`대기 중 모든 온실가스를 순간 동결시킨다.`,`자외선을 차단해 피부를 보호하는 차광막을 형성한다.`],correctIndex:0,explanation:`VOCs는 햇빛(자외선)을 받아 라디칼로 분해된 뒤 질소산화물과 연쇄 광화학 반응을 일으켜 인체 점막을 자극하는 고농도 지표면 오존(O₃)과 유독성 광화학 스모그를 생성합니다.`},{stageNumber:15,substanceName:`석탄 비산재`,chemicalFormula:`Fly Ash`,question:`화력발전소 등에서 석탄 연소 후 배출되는 미세 분진인 비산재(Fly Ash)가 위험한 이유는?`,options:[`순수 질소 기체로만 이루어져 공기 중에 흩어지기 때문이다.`,`비소(As), 납(Pb), 카드뮴(Cd) 등 독성 중금속을 다량 함유하며 폐 규폐증을 유발하기 때문이다.`,`달콤한 향기로 야생 동물을 유혹하기 때문이다.`,`지표면 온도를 0℃ 이하로 급랭시키기 때문이다.`],correctIndex:1,explanation:`석탄 비산재는 미분탄 연소 시 생기는 유리질 미립자로 비소, 납, 카드뮴, 수은 등 맹독성 중금속이 고농도로 농축되어 있어 흡입 시 폐 규폐증을 일으키고 토양과 지하수를 영구 오염시킵니다.`},{stageNumber:16,substanceName:`질산염 미세입자`,chemicalFormula:`NO₃⁻ Aerosol`,question:`겨울철 고농도 초미세먼지의 50% 이상을 차지하는 질산염의 대기 중 2차 생성 과정은?`,options:[`산소와 수소가 결합해 순수한 생수로 액화된다.`,`배출된 NO₂가 질산(HNO₃)이 된 후 대기 중 암모니아(NH₃)와 결합해 고체 입자로 2차 합성된다.`,`식물이 광합성을 통해 잎에서 고체 소금을 뿜어낸다.`,`바닷물 수증기가 얼어붙어 생긴 순수 얼음 알갱이다.`],correctIndex:1,explanation:`질산염 미세입자는 자동차 등에서 가스 상태로 배출된 NOx가 대기 산화 반응으로 질산 증기가 된 뒤, 가축 분뇨 등에서 발생한 암모니아 가스와 결합해 고체 미세먼지(질산암모늄)로 2차 생성됩니다.`},{stageNumber:17,substanceName:`황산염 에어로졸`,chemicalFormula:`SO₄²⁻ Fog`,question:`화석연료 SO₂ 가스가 2차 산화되어 생성된 황산염 에어로졸의 기후 및 인체 악영향은?`,options:[`햇빛을 우주로 산란시켜 기후를 교란하고 폐포 깊숙이 침투해 만성 폐쇄성 폐질환(COPD)을 유발한다.`,`공기 중 산소 농도를 2배로 농축시킨다.`,`비의 산도를 완벽한 중성(pH 7.0)으로 정화한다.`,`자외선을 완전히 없애 비타민 D 합성을 돕는다.`],correctIndex:0,explanation:`황산염 에어로졸은 햇빛을 산란시켜 국지적 기후 변화를 유발하고, 극도로 작은 입자 크기로 폐포 깊숙이 도달해 폐 조직을 손상시켜 COPD와 심혈관계 질환을 악화시킵니다.`},{stageNumber:18,substanceName:`비메탄계 탄화수소`,chemicalFormula:`NMHC`,question:`고온 불완전 연소로 배출되는 반응성 비메탄계 탄화수소(NMHC)의 화학적 특징은?`,options:[`메탄에 비해 반응성이 매우 높아 유독한 광화학 물질(PAN, 오존) 생성을 폭발적으로 가속한다.`,`화학적으로 완전히 비활성이어서 대기 중에서 수백 년간 전혀 반응하지 않는다.`,`식물의 광합성 효율을 극대화하여 숲을 푸르게 가꾼다.`,`물과 닿으면 즉시 증발하여 무해한 산소 기체로 바뀐다.`],correctIndex:0,explanation:`에탄, 프로판 등 비메탄 탄화수소는 메탄에 비해 화학 반응성이 수십~수백 배 커서 질소산화물과 결합하여 극도로 유독한 과산화아세틸질산염(PAN)과 오존 생성을 촉진합니다.`},{stageNumber:19,substanceName:`광화학 옥시던트 군주`,chemicalFormula:`Photochemical King`,question:`질소산화물과 VOCs가 자외선으로 복합 반응해 탄생한 광화학 옥시던트가 식물에 미치는 피해는?`,options:[`식물의 엽록소를 산화·표백시켜 잎을 괴사시키고 광합성을 전면 중단시킨다.`,`뿌리를 튼튼하게 하여 식물의 생장을 3배 촉진한다.`,`잎 표면에 수분을 공급해 가뭄을 이겨내게 한다.`,`꽃의 향기를 증폭시켜 수분을 돕는다.`],correctIndex:0,explanation:`광화학 옥시던트는 강력한 산화 작용으로 식물의 기공을 통해 들어가 엽록소를 표백·괴사(반점 형성)시키고 식물의 광합성을 마비시켜 삼림을 고사시킵니다.`},{stageNumber:20,substanceName:`기후 재앙 코어`,chemicalFormula:`Climate Disaster Core`,question:`인류의 무분별한 화석연료 연소로 누적된 온실가스와 공해물질이 초래하는 전 지구적 영향은?`,options:[`극단적 폭염·한파, 해수면 상승, 대기질 악화, 생태계 붕괴 등 전 지구적 기후 위기 초래`,`지구 자전 속도가 2배 빨라져 하루가 12시간으로 단축`,`바닷물이 모두 증발하여 사막만 남는 현상`,`지구 중력이 0이 되어 대기가 우주로 모두 날아감`],correctIndex:0,explanation:`화석연료 연소에 의한 온실가스 배출은 전
